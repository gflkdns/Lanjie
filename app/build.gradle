plugins {
    id 'com.android.application'
}

dependencies {
    implementation project(':call-account')
}

android {
    namespace 'com.aoye.lanjie'
    compileSdk 35

    defaultConfig {
        applicationId "com.aoye.lanjie"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
